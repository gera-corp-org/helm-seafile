name: chart

# Publishes the chart as an OCI artifact to GHCR. Artifact Hub indexes it
# straight from there — no gh-pages branch or index.yaml needed.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The publishing organization is pinned explicitly rather than via
  # github.repository_owner: the personal gera-corp account is a
  # different entity, and the address ArtifactHub tracks must not
  # depend on where the workflow happens to run (a fork, a repo move).
  ORG: gera-corp-org

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # not preinstalled on the runner, but needed to push the metadata
      - uses: oras-project/setup-oras@v2

      - name: Lint
        run: |
          # --verify=false is required from Helm 3.19 on: plugins installed
          # straight from a git URL carry no provenance for Helm to check,
          # and without the flag the install aborts.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version v1.1.2 --verify=false
          helm lint . --strict --set seafile.serverHostname=seafile.example.com
          helm unittest .

      - name: Check the README install examples match the chart version
        run: |
          # The README went stale before — it advertised 0.1.1 while the
          # chart was 0.1.5 — so this is checked rather than remembered.
          want=$(helm show chart . | awk '/^version:/ {print $2}' | tr -d '"')
          bad=$(grep -oE -- '--version [0-9]+\.[0-9]+\.[0-9]+' README.md \
                | awk '{print $2}' | sort -u | grep -v "^${want}$" || true)
          if [ -n "$bad" ]; then
            echo "::error::README installs $bad, chart version is $want"
            exit 1
          fi
          echo "README install examples all pin $want"

      - name: Render every branch of the templates
        # This is the exact step whose absence once let secretName: map[]
        # slip into a published chart.
        run: ./scripts/render-matrix.sh

      - name: Check the tag and the chart agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Tag v0.1.6 once published chart 0.1.5. Never again.
          want="${GITHUB_REF_NAME#v}"
          got=$(helm show chart . | awk '/^version:/ {print $2}' | tr -d '"')
          if [ "$want" != "$got" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version: $got in Chart.yaml"
            exit 1
          fi

      # A pull request only validates, it never publishes
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm package . -d /tmp
          version="${GITHUB_REF_NAME#v}"
          helm push "/tmp/seafile-${version}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.ORG }}/helm-charts"

      # Also on manual dispatch: the ownership claim is independent of the
      # chart version, and fixing it shouldn't require an extra release.
      - name: Push the Artifact Hub ownership metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Artifact Hub looks for this artifact next to the chart in the
          # registry. Its absence is exactly what kept verified_publisher: false.
          oras push \
            "${{ env.REGISTRY }}/${{ env.ORG }}/helm-charts/seafile:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
