name: chart

# Публикует чарт OCI-артефактом в GHCR. Artifact Hub индексирует его
# прямо оттуда — без ветки gh-pages и index.yaml.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Публикующая организация зафиксирована явно, а не через
  # github.repository_owner: личный аккаунт gera-corp — другая
  # сущность, и адрес, за которым следит ArtifactHub, не должен
  # зависеть от того, откуда запущен workflow (форк, перенос репо).
  ORG: gera-corp-org

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # не стоит на раннере по умолчанию, а без него не запушить метаданные
      - uses: oras-project/setup-oras@v2

      - name: Lint
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2
          helm lint . --strict --set seafile.serverHostname=seafile.example.com
          helm unittest .

      - name: Render every branch of the templates
        # Тот самый шаг, отсутствие которого пропустило secretName: map[]
        # в опубликованный чарт.
        run: ./scripts/render-matrix.sh

      - name: Check the tag and the chart agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Тег v0.1.6 однажды опубликовал чарт 0.1.5. Больше нет.
          want="${GITHUB_REF_NAME#v}"
          got=$(helm show chart . | awk '/^version:/ {print $2}' | tr -d '"')
          if [ "$want" != "$got" ]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с version: $got в Chart.yaml"
            exit 1
          fi

      # pull request только проверяет, никогда не публикует
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          helm package . -d /tmp
          version="${GITHUB_REF_NAME#v}"
          helm push "/tmp/seafile-${version}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ env.ORG }}/helm-charts"

      # Также на ручном запуске: заявка о владении не зависит от версии
      # чарта, и её исправление не должно требовать лишнего релиза.
      - name: Push the Artifact Hub ownership metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # Artifact Hub ищет этот артефакт рядом с чартом в реестре.
          # Именно его отсутствие держало verified_publisher: false.
          oras push \
            "${{ env.REGISTRY }}/${{ env.ORG }}/helm-charts/seafile:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+json \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
