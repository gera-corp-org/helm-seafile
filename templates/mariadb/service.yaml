{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seafile.mariadb.fullname" . }}
  labels:
    {{- include "seafile.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
  - port: 3306
    targetPort: mysql
    protocol: TCP
    name: mysql
  selector:
    {{- include "seafile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
{{- end }}
