apiVersion: v1
kind: Pod
metadata:
  name: {{ include "seafile.fullname" . }}-test-connection
  labels: {{- include "seafile.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: ping
    image: docker.io/curlimages/curl:8.11.1
    command: ["curl"]
    args:
    - --fail
    - --silent
    - --show-error
    - --max-time
    - "10"
    - "http://{{ include "seafile.fullname" . }}:{{ .Values.service.port }}/api2/ping/"
