{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seafile.fullname" . }}
  labels: {{- include "seafile.labels" . | nindent 4 }}
  annotations:
    # Снимает ограничение на размер тела запроса: Seafile грузит
    # файлы произвольного размера.
    # https://github.com/kubernetes/ingress-nginx/blob/main/docs/user-guide/nginx-configuration/annotations.md#custom-max-body-size
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- if .Values.ingress.traefik.buffering }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-buffering@kubernetescrd" .Release.Namespace (include "seafile.fullname" .) }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
    secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled is true" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
  - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "seafile.fullname" . }}
            port:
              number: {{ .Values.service.port }}
      {{- if .Values.seafile.webdav.enabled }}
      - path: {{ .Values.ingress.webdav.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "seafile.fullname" . }}
            port:
              number: 8080
      {{- end }}
{{- end }}
