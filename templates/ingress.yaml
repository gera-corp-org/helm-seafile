{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seafile.fullname" . }}
  labels: {{- include "seafile.labels" . | nindent 4 }}
  # Lifts the request body size limit: Seafile uploads files of
  # arbitrary size. User-supplied ingress.annotations win over these
  # defaults — merge(dst, src) gives priority to dst.
  # https://github.com/kubernetes/ingress-nginx/blob/main/docs/user-guide/nginx-configuration/annotations.md#custom-max-body-size
  {{- $annotations := dict "nginx.ingress.kubernetes.io/proxy-body-size" "0" }}
  {{- if .Values.ingress.traefik.buffering }}
  {{- $_ := set $annotations "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-buffering@kubernetescrd" .Release.Namespace (include "seafile.fullname" .)) }}
  {{- end }}
  {{- $annotations = merge (deepCopy .Values.ingress.annotations) $annotations }}
  annotations: {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
    secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled is true" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
  - host: {{ required "ingress.host is required when ingress.enabled is true" .Values.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "seafile.fullname" . }}
            port:
              number: {{ .Values.service.port }}
      {{- if .Values.seafile.webdav.enabled }}
      - path: {{ .Values.ingress.webdav.path }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "seafile.fullname" . }}
            port:
              number: 8080
      {{- end }}
{{- end }}
