apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "seafile.fullname" . }}
  labels: {{- include "seafile.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "seafile.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "seafile.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: seafile
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "seafile.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seafile
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.seafile.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "seafile.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.persistence.existingClaim }}
      volumes:
      - name: seafile-data
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.existingClaim }}
      {{- else if not .Values.persistence.enabled }}
      volumes:
      - name: seafile-data
        emptyDir: {}
      {{- end }}
      containers:
      - name: seafile
        image: {{ include "seafile.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext: {{- toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: TIME_ZONE
          value: {{ .Values.seafile.timeZone | quote }}
        - name: SEAFILE_SERVER_HOSTNAME
          value: {{ required "seafile.serverHostname is required" .Values.seafile.serverHostname | quote }}
        - name: SEAFILE_SERVER_PROTOCOL
          value: {{ .Values.seafile.protocol | quote }}
        - name: SEAFILE_SERVER_LETSENCRYPT
          value: "false"
        # Used to be hardcoded to "true" regardless of the protocol.
        - name: FORCE_HTTPS_IN_CONF
          value: {{ eq .Values.seafile.protocol "https" | quote }}
        - name: SEAFILE_LOG_TO_STDOUT
          value: {{ .Values.seafile.logToStdout | quote }}
        - name: INIT_SEAFILE_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ include "seafile.secretName" . }}
              key: admin-email
        - name: INIT_SEAFILE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "seafile.secretName" . }}
              key: admin-password
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "seafile.secretName" . }}
              key: jwt-private-key
        - name: SEAFILE_MYSQL_DB_HOST
          value: {{ include "seafile.database.host" . | quote }}
        - name: SEAFILE_MYSQL_DB_PORT
          value: {{ .Values.database.port | quote }}
        - name: SEAFILE_MYSQL_DB_USER
          value: {{ .Values.database.user | quote }}
        - name: SEAFILE_MYSQL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "seafile.database.secretName" . }}
              key: mariadb-password
        - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "seafile.database.secretName" . }}
              key: mariadb-root-password
        - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
          value: {{ .Values.database.names.ccnet | quote }}
        - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
          value: {{ .Values.database.names.seafile | quote }}
        - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
          value: {{ .Values.database.names.seahub | quote }}
        - name: CACHE_PROVIDER
          value: {{ .Values.cache.provider | quote }}
        {{- if eq .Values.cache.provider "redis" }}
        - name: REDIS_HOST
          value: {{ include "seafile.cache.host" . | quote }}
        - name: REDIS_PORT
          value: {{ .Values.cache.port | quote }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "seafile.cache.secretName" . }}
              key: redis-password
        {{- else }}
        - name: MEMCACHED_HOST
          value: {{ include "seafile.cache.host" . | quote }}
        - name: MEMCACHED_PORT
          value: {{ .Values.cache.port | quote }}
        {{- end }}
        {{- with .Values.seafile.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.seafile.extraEnvFrom }}
        envFrom: {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        {{- if .Values.seafile.webdav.enabled }}
        - name: http-webdav
          containerPort: 8080
          protocol: TCP
        {{- end }}
        {{- with .Values.startupProbe }}
        startupProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: seafile-data
          mountPath: /shared
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
  - metadata:
      name: seafile-data
      {{- with .Values.persistence.annotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- with .Values.persistence.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
  {{- end }}
