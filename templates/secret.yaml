{{- if not .Values.seafile.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seafile.fullname" . }}
  labels: {{- include "seafile.labels" . | nindent 4 }}
type: Opaque
data:
  admin-email: {{ .Values.seafile.admin.email | b64enc | quote }}
  admin-password: {{ .Values.seafile.admin.password | b64enc | quote }}
  jwt-private-key: {{ .Values.seafile.jwtPrivateKey | b64enc | quote }}
{{- end }}
