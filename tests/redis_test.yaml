suite: redis
templates:
  - redis/statefulset.yaml
  - redis/service.yaml
  - redis/secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: StatefulSet is not created when cache.enabled is false
    template: redis/statefulset.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: Service is not created when cache.enabled is false
    template: redis/service.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
    asserts:
      - hasDocuments:
          count: 0

  # Finding 1 (CRITICAL): with provider redis, the seafile statefulset
  # references redis-password unconditionally on enabled. The secret is
  # gated only by existingSecret (and provider), otherwise the pod with
  # an external Redis would fail to start.
  - it: secret is still created when cache.enabled is false, because the seafile pod references it unconditionally (provider redis)
    template: redis/secret.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
      cache.password: cachepass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-seafile-redis
      - equal:
          path: data["redis-password"]
          value: Y2FjaGVwYXNz

  # Finding 2: provider memcached must not deploy Redis — otherwise
  # Seafile gets MEMCACHED_HOST/PORT pointing at a Redis server that
  # speaks the wrong protocol.
  - it: Redis StatefulSet is not created with provider memcached, even when cache.enabled is true
    template: redis/statefulset.yaml
    set:
      cache.provider: memcached
      cache.enabled: true
      cache.host: mc.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: Redis Service is not created with provider memcached, even when cache.enabled is true
    template: redis/service.yaml
    set:
      cache.provider: memcached
      cache.enabled: true
      cache.host: mc.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: Redis Secret is not created with provider memcached, even when cache.enabled is true
    template: redis/secret.yaml
    set:
      cache.provider: memcached
      cache.enabled: true
      cache.host: mc.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: password does not end up in the command args
    template: redis/statefulset.yaml
    set:
      cache.password: redispass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: redispass

  - it: password comes from the secret via an environment variable
    template: redis/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-redis
                key: redis-password

  - it: command is not overridden (so the entrypoint keeps working)
    template: redis/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: password is passed via a variable in args, not exposed directly
    template: redis/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "$(REDIS_PASSWORD)"

  - it: service listens on 6379
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6379

  # Finding 4: the component label distinguishes the redis Service/
  # StatefulSet from mariadb and seafile.
  - it: StatefulSet carries component=redis label in both selector and pod template
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: redis
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: redis

  - it: Service selects pods by component=redis
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: redis

  # Finding 6: the component label is on metadata too, not only in the
  # selector.
  - it: Service carries component label in metadata.labels
    template: redis/service.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: redis

  - it: Secret carries component label in metadata.labels
    template: redis/secret.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: redis

  - it: no securityContext by default
    template: redis/statefulset.yaml
    asserts:
      - isNull:
          path: spec.template.spec.securityContext
      - isNull:
          path: spec.template.spec.containers[0].securityContext

  - it: podSecurityContext and securityContext are passed through
    template: redis/statefulset.yaml
    set:
      cache.podSecurityContext:
        runAsNonRoot: true
      cache.securityContext:
        runAsUser: 999
        capabilities:
          drop: [ALL]
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 999
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
