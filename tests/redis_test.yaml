suite: redis
templates:
  - redis/statefulset.yaml
  - redis/service.yaml
  - redis/secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: при cache.enabled false StatefulSet не создаётся
    template: redis/statefulset.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: при cache.enabled false Service не создаётся
    template: redis/service.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
    asserts:
      - hasDocuments:
          count: 0

  # Находка 1 (CRITICAL): при provider redis статефулсет seafile ссылается
  # на redis-password безусловно от enabled. Секрет закрыт только
  # existingSecret (и provider), иначе под с внешним Redis не стартует.
  - it: при cache.enabled false секрет всё равно создаётся, потому что под seafile ссылается на него безусловно (provider redis)
    template: redis/secret.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
      cache.password: cachepass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-seafile-redis
      - equal:
          path: data["redis-password"]
          value: Y2FjaGVwYXNz

  - it: пароль не попадает в аргументы команды
    template: redis/statefulset.yaml
    set:
      cache.password: redispass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: redispass

  - it: пароль приходит из секрета через переменную окружения
    template: redis/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-redis
                key: redis-password

  - it: command не переопределяется (чтобы entrypoint работал)
    template: redis/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: пароль передаётся через переменную в args, не раскрытым
    template: redis/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "$(REDIS_PASSWORD)"

  - it: сервис слушает 6379
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6379
