suite: redis
templates:
  - redis/statefulset.yaml
  - redis/service.yaml
  - redis/secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: при cache.enabled false StatefulSet не создаётся
    template: redis/statefulset.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: при cache.enabled false Service не создаётся
    template: redis/service.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
    asserts:
      - hasDocuments:
          count: 0

  # Находка 1 (CRITICAL): при provider redis статефулсет seafile ссылается
  # на redis-password безусловно от enabled. Секрет закрыт только
  # existingSecret (и provider), иначе под с внешним Redis не стартует.
  - it: при cache.enabled false секрет всё равно создаётся, потому что под seafile ссылается на него безусловно (provider redis)
    template: redis/secret.yaml
    set:
      cache.enabled: false
      cache.host: redis.example.com
      cache.password: cachepass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-seafile-redis
      - equal:
          path: data["redis-password"]
          value: Y2FjaGVwYXNz

  # Находка 2: provider memcached не должен разворачивать Redis — иначе
  # Seafile получает MEMCACHED_HOST/PORT, указывающие на Redis-сервер,
  # который говорит по чужому протоколу.
  - it: при provider memcached StatefulSet Redis не создаётся, даже если cache.enabled true
    template: redis/statefulset.yaml
    set:
      cache.provider: memcached
      cache.enabled: true
      cache.host: mc.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: при provider memcached Service Redis не создаётся, даже если cache.enabled true
    template: redis/service.yaml
    set:
      cache.provider: memcached
      cache.enabled: true
      cache.host: mc.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: при provider memcached Secret Redis не создаётся, даже если cache.enabled true
    template: redis/secret.yaml
    set:
      cache.provider: memcached
      cache.enabled: true
      cache.host: mc.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: пароль не попадает в аргументы команды
    template: redis/statefulset.yaml
    set:
      cache.password: redispass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: redispass

  - it: пароль приходит из секрета через переменную окружения
    template: redis/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-redis
                key: redis-password

  - it: command не переопределяется (чтобы entrypoint работал)
    template: redis/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: пароль передаётся через переменную в args, не раскрытым
    template: redis/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "$(REDIS_PASSWORD)"

  - it: сервис слушает 6379
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6379

  # Находка 4: метка component различает Service/StatefulSet redis от
  # mariadb и seafile.
  - it: StatefulSet несёт метку component=redis и в selector, и в шаблоне пода
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: redis
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: redis

  - it: Service селектит поды по component=redis
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: redis

  # Находка 6: метка component есть и в metadata, не только в selector.
  - it: Service несёт метку component в metadata.labels
    template: redis/service.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: redis

  - it: Secret несёт метку component в metadata.labels
    template: redis/secret.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: redis
