suite: service
templates:
  - service.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: renders a plain ClusterIP service, not headless
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - isNull:
          path: spec.clusterIP

  - it: the memcached ExternalName service is gone
    asserts:
      - hasDocuments:
          count: 1

  - it: webdav port appears only when webdav is enabled
    set:
      seafile.webdav.enabled: true
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 2

  - it: selector distinguishes the chart's workloads by component label
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: seafile

  # Finding 5: targetPort must be the container port's name ("http"), not
  # a number — kubeconform accepts any string/number as IntOrString, so
  # a regression is only caught by an explicit assert on the value.
  - it: targetPort references the container's named port, not a number
    asserts:
      - equal:
          path: spec.ports[0].targetPort
          value: http
