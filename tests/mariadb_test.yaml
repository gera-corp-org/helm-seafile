suite: mariadb
templates:
  - mariadb/statefulset.yaml
  - mariadb/service.yaml
  - mariadb/secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: StatefulSet is not created when database.enabled is false
    template: mariadb/statefulset.yaml
    set:
      database.enabled: false
      database.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: Service is not created when database.enabled is false
    template: mariadb/service.yaml
    set:
      database.enabled: false
      database.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0

  # Finding 1 (CRITICAL): the secret is needed for an external database
  # too — statefulset.yaml references it unconditionally (mariadb-password,
  # mariadb-root-password for INIT_SEAFILE_MYSQL_ROOT_PASSWORD). The secret
  # is gated only by existingSecret, not by enabled — otherwise the pod
  # with an external database would fail to start.
  - it: secret is still created when database.enabled is false, because the seafile pod references it unconditionally
    template: mariadb/secret.yaml
    set:
      database.enabled: false
      database.host: db.example.com
      database.rootPassword: rootpass
      database.password: dbpass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-seafile-mariadb
      - equal:
          path: data["mariadb-password"]
          value: ZGJwYXNz

  - it: mariadb image is pinned, not latest
    template: mariadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/mariadb:11.4

  - it: root password comes from the secret
    template: mariadb/statefulset.yaml
    set:
      database.rootPassword: rootpass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-mariadb
                key: mariadb-root-password

  - it: service listens on 3306
    template: mariadb/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 3306

  - it: secret is not created when existingSecret is set
    template: mariadb/secret.yaml
    set:
      database.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 0

  # Finding 4: the component label distinguishes the mariadb Service/
  # StatefulSet from redis and seafile — without it, the Service starts
  # spraying 3306 across every pod in the release.
  - it: StatefulSet carries component=mariadb label in both selector and pod template
    template: mariadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: mariadb
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: mariadb

  - it: Service selects pods by component=mariadb
    template: mariadb/service.yaml
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: mariadb

  # Finding 6: the component label is on metadata too, not only in the
  # selector — otherwise kubectl get -l app.kubernetes.io/component=mariadb
  # won't find the Service/Secret.
  - it: Service carries component label in metadata.labels
    template: mariadb/service.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mariadb

  - it: Secret carries component label in metadata.labels
    template: mariadb/secret.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mariadb

  - it: no subPath on the volume mount by default
    template: mariadb/statefulset.yaml
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath

  - it: subPath mounts a subdirectory as the data directory
    template: mariadb/statefulset.yaml
    set:
      database.persistence.subPath: data
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/mysql
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: data
