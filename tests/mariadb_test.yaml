suite: mariadb
templates:
  - mariadb/statefulset.yaml
  - mariadb/service.yaml
  - mariadb/secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: при database.enabled false StatefulSet не создаётся
    template: mariadb/statefulset.yaml
    set:
      database.enabled: false
      database.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: при database.enabled false Service не создаётся
    template: mariadb/service.yaml
    set:
      database.enabled: false
      database.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0

  # Находка 1 (CRITICAL): секрет нужен и для внешней БД — statefulset.yaml
  # ссылается на него безусловно (mariadb-password, mariadb-root-password
  # для INIT_SEAFILE_MYSQL_ROOT_PASSWORD). Секрет закрыт только
  # existingSecret, а не enabled — иначе под с внешней БД не стартует.
  - it: при database.enabled false секрет всё равно создаётся, потому что под seafile ссылается на него безусловно
    template: mariadb/secret.yaml
    set:
      database.enabled: false
      database.host: db.example.com
      database.rootPassword: rootpass
      database.password: dbpass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-seafile-mariadb
      - equal:
          path: data["mariadb-password"]
          value: ZGJwYXNz

  - it: образ mariadb запинен, а не latest
    template: mariadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/mariadb:11.4

  - it: root-пароль приходит из секрета
    template: mariadb/statefulset.yaml
    set:
      database.rootPassword: rootpass
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MARIADB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-mariadb
                key: mariadb-root-password

  - it: сервис слушает 3306
    template: mariadb/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 3306

  - it: при existingSecret секрет не создаётся
    template: mariadb/secret.yaml
    set:
      database.existingSecret: my-db-secret
    asserts:
      - hasDocuments:
          count: 0
