suite: statefulset
templates:
  - statefulset.yaml
  - secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: image is composed from repository and appVersion
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/seafileltd/seafile-mc:13.0.25

  - it: selector and pod carry a component label distinguishing them from mariadb/redis
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: seafile
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: seafile

  - it: FORCE_HTTPS_IN_CONF is derived from protocol, not hardcoded
    template: statefulset.yaml
    set:
      seafile.protocol: https
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FORCE_HTTPS_IN_CONF
            value: "true"

  - it: FORCE_HTTPS_IN_CONF is false when protocol is http
    template: statefulset.yaml
    set:
      seafile.protocol: http
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FORCE_HTTPS_IN_CONF
            value: "false"

  - it: no password is set in plain text
    template: statefulset.yaml
    set:
      seafile.admin.password: s3cret
      database.password: dbpass
      cache.password: redispass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEAFILE_MYSQL_DB_PASSWORD
            value: dbpass
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEAFILE_MYSQL_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-mariadb
                key: mariadb-password

  - it: extraEnv is appended last and overrides everything else
    template: statefulset.yaml
    set:
      seafile.extraEnv:
        - name: TIME_ZONE
          value: Europe/Prague
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[-1].name
          value: TIME_ZONE
      - equal:
          path: spec.template.spec.containers[0].env[-1].value
          value: Europe/Prague

  - it: webdav port appears only when webdav is enabled
    template: statefulset.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1

  - it: webdav opens a second port
    template: statefulset.yaml
    set:
      seafile.webdav.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2

  - it: provider memcached emits MEMCACHED instead of REDIS
    template: statefulset.yaml
    set:
      cache.provider: memcached
      cache.enabled: false
      cache.host: mc.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEMCACHED_HOST
            value: mc.example.com
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: mc.example.com

  - it: render fails without serverHostname
    template: statefulset.yaml
    set:
      seafile.serverHostname: ""
    asserts:
      - failedTemplate:
          errorMessage: "seafile.serverHostname is required"

  - it: volumeClaimTemplate is not created when existingClaim is set
    template: statefulset.yaml
    set:
      persistence.existingClaim: my-pvc
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates

  # Finding 5: the README promises that helm.sh/resource-policy: keep
  # protects the PVC from deletion on helm uninstall. Silently losing
  # this annotation is data loss, not just a manifest discrepancy.
  - it: volumeClaimTemplate carries the helm.sh/resource-policy keep annotation
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["helm.sh/resource-policy"]
          value: keep

  # Finding 5: replicaCount: 0 is documented as a way to stop Seafile
  # without deleting the release/data — replicas must actually come from
  # values.
  - it: replicaCount 0 stops the StatefulSet
    template: statefulset.yaml
    set:
      replicaCount: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: replicaCount defaults to 1
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
