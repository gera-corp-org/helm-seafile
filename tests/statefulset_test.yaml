suite: statefulset
templates:
  - statefulset.yaml
  - secret.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: образ собирается из repository и appVersion
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/seafileltd/seafile-mc:13.0.25

  - it: селектор и под несут метку component, отличающую от mariadb/redis
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: seafile
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: seafile

  - it: FORCE_HTTPS_IN_CONF выводится из protocol, а не захардкожен
    template: statefulset.yaml
    set:
      seafile.protocol: https
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FORCE_HTTPS_IN_CONF
            value: "true"

  - it: FORCE_HTTPS_IN_CONF false при protocol http
    template: statefulset.yaml
    set:
      seafile.protocol: http
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FORCE_HTTPS_IN_CONF
            value: "false"

  - it: ни один пароль не задан открытым текстом
    template: statefulset.yaml
    set:
      seafile.admin.password: s3cret
      database.password: dbpass
      cache.password: redispass
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEAFILE_MYSQL_DB_PASSWORD
            value: dbpass
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEAFILE_MYSQL_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: t-seafile-mariadb
                key: mariadb-password

  - it: extraEnv добавляется последним и переопределяет остальное
    template: statefulset.yaml
    set:
      seafile.extraEnv:
        - name: TIME_ZONE
          value: Europe/Prague
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[-1].name
          value: TIME_ZONE
      - equal:
          path: spec.template.spec.containers[0].env[-1].value
          value: Europe/Prague

  - it: порт webdav появляется только при включённом webdav
    template: statefulset.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1

  - it: при webdav открывается второй порт
    template: statefulset.yaml
    set:
      seafile.webdav.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 2

  - it: provider memcached выдаёт MEMCACHED вместо REDIS
    template: statefulset.yaml
    set:
      cache.provider: memcached
      cache.enabled: false
      cache.host: mc.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MEMCACHED_HOST
            value: mc.example.com
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: mc.example.com

  - it: без serverHostname рендер падает
    template: statefulset.yaml
    set:
      seafile.serverHostname: ""
    asserts:
      - failedTemplate:
          errorMessage: "seafile.serverHostname is required"

  - it: volumeClaimTemplate не создаётся при existingClaim
    template: statefulset.yaml
    set:
      persistence.existingClaim: my-pvc
    asserts:
      - isNull:
          path: spec.volumeClaimTemplates

  # Находка 5: README обещает, что helm.sh/resource-policy: keep защищает
  # PVC от удаления при helm uninstall. Тихая потеря этого блока — потеря
  # данных, а не просто отличие в манифесте.
  - it: volumeClaimTemplate несёт аннотацию helm.sh/resource-policy keep
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["helm.sh/resource-policy"]
          value: keep

  # Находка 5: replicaCount: 0 документирован как способ остановки Seafile
  # без удаления релиза/данных — replicas обязан реально браться из values.
  - it: replicaCount 0 останавливает StatefulSet
    template: statefulset.yaml
    set:
      replicaCount: 0
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: replicaCount по умолчанию равен 1
    template: statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
