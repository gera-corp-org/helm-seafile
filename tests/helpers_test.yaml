suite: helpers
templates:
  - statefulset.yaml
  - secret.yaml
release:
  name: t
  namespace: seafile
tests:
  - it: database.host defaults to the bundled service with clusterDomain
    template: statefulset.yaml
    set:
      seafile.serverHostname: seafile.example.com
      database.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEAFILE_MYSQL_DB_HOST
            value: t-seafile-mariadb.seafile.svc.cluster.local

  - it: FQDN never ends with a dot
    template: statefulset.yaml
    set:
      seafile.serverHostname: seafile.example.com
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="SEAFILE_MYSQL_DB_HOST")].value
          pattern: '\.$'

  - it: external database without host fails with a clear error
    template: statefulset.yaml
    set:
      seafile.serverHostname: seafile.example.com
      database.enabled: false
      database.host: ""
    asserts:
      - failedTemplate:
          errorMessage: "database.host is required when database.enabled is false"

  # Finding 5: an explicit database.host must win over the bundled FQDN
  # even when database.enabled is true — otherwise migrating to a managed
  # database without also flipping enabled off silently keeps hitting the
  # bundled service.
  - it: explicit database.host wins over the bundled service even when database.enabled is true
    template: statefulset.yaml
    set:
      seafile.serverHostname: seafile.example.com
      database.enabled: true
      database.host: managed-db.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SEAFILE_MYSQL_DB_HOST
            value: managed-db.example.com

  - it: explicit cache.host wins over the bundled service even when cache.enabled is true
    template: statefulset.yaml
    set:
      seafile.serverHostname: seafile.example.com
      cache.enabled: true
      cache.host: managed-redis.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            value: managed-redis.example.com
