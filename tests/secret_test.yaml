suite: seafile secret
templates:
  - secret.yaml
release:
  name: t
  namespace: seafile
tests:
  - it: creates a secret with three keys
    set:
      seafile.serverHostname: seafile.example.com
      seafile.admin.email: admin@example.com
      seafile.admin.password: s3cret
      seafile.jwtPrivateKey: jwtkey
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: t-seafile
      - equal:
          path: data["admin-email"]
          value: YWRtaW5AZXhhbXBsZS5jb20=
      - exists:
          path: data["admin-password"]
      - exists:
          path: data["jwt-private-key"]

  - it: own secret is not created when existingSecret is set
    set:
      seafile.serverHostname: seafile.example.com
      seafile.existingSecret: my-secret
    asserts:
      - hasDocuments:
          count: 0
