suite: ingress
templates:
  - ingress.yaml
  - middleware.yaml
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: Ingress is not created by default
    asserts:
      - hasDocuments:
          count: 0

  - it: tls section is absent without tls.enabled
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
    asserts:
      - isNull:
          path: spec.tls
      - equal:
          path: spec.rules[0].host
          value: seafile.example.com

  - it: tls takes host from ingress.host and doesn't render a map
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
      ingress.tls.enabled: true
      ingress.tls.secretName: seafile-tls
    asserts:
      - equal:
          path: spec.tls[0].hosts[0]
          value: seafile.example.com
      - equal:
          path: spec.tls[0].secretName
          value: seafile-tls

  - it: className becomes a field, not an annotation
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
      ingress.className: nginx
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx
      - isNull:
          path: metadata.annotations["kubernetes.io/spec.ingressClassName"]

  - it: seafdav path is absent without webdav
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1

  - it: webdav adds a second path on port 8080
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
      seafile.webdav.enabled: true
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 2
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /seafdav
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.port.number
          value: 8080

  - it: buffering creates a Middleware and wires it via annotation
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
      ingress.traefik.buffering: true
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.middlewares"]
          value: seafile-t-seafile-buffering@kubernetescrd

  - it: Middleware is not created without buffering
    template: middleware.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: default proxy-body-size is present exactly once without custom annotations
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
    asserts:
      - equal:
          path: metadata.annotations
          value:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"

  - it: custom annotations.proxy-body-size overrides the default without duplicating the key
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: seafile.example.com
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 1m
    asserts:
      - equal:
          path: metadata.annotations
          value:
            nginx.ingress.kubernetes.io/proxy-body-size: "1m"
