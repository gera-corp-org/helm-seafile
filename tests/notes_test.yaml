suite: NOTES.txt
templates:
  - NOTES.txt
release:
  name: t
  namespace: seafile
set:
  seafile.serverHostname: seafile.example.com
tests:
  - it: warns about empty database.rootPassword when there is no existingSecret
    set:
      database.rootPassword: ""
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: database.rootPassword is empty"

  - it: warns about empty database.password when there is no existingSecret
    set:
      database.password: ""
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: database.password is empty"

  - it: does not warn about the database password when database.existingSecret is set
    set:
      database.existingSecret: my-db-secret
      database.rootPassword: ""
      database.password: ""
    asserts:
      - notMatchRegexRaw:
          pattern: "database.rootPassword"
      - notMatchRegexRaw:
          pattern: "database.password"

  - it: warns about empty cache.password for the bundled redis without existingSecret
    set:
      cache.provider: redis
      cache.password: ""
    asserts:
      - matchRegexRaw:
          pattern: "WARNING: cache.password is empty"

  - it: does not warn about cache.password when cache.existingSecret is set
    set:
      cache.existingSecret: my-cache-secret
      cache.password: ""
    asserts:
      - notMatchRegexRaw:
          pattern: "cache.password"

  - it: does not warn about cache.password when provider is memcached
    set:
      cache.provider: memcached
      cache.host: mc.example.com
      cache.password: ""
    asserts:
      - notMatchRegexRaw:
          pattern: "cache.password"
