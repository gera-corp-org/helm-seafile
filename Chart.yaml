apiVersion: v2
name: seafile
type: application
version: 0.2.0
appVersion: "13.0.25"
icon: https://www.seafile.com/media/img/seafile-logo.png
home: https://github.com/gera-corp-org/helm-seafile
description: Seafile Server, Reliable and Performant File Sync and Share Solution on Kubernetes
keywords:
  - cloud
  - file
  - share
  - sync
sources:
  - https://github.com/gera-corp-org/helm-seafile
maintainers:
  - name: gera
    email: exandore@gmail.com
kubeVersion: ">=1.19.0-0"
annotations:
  artifacthub.io/changes: |
    - kind: removed
      description: "Removed the Bitnami dependencies — their images were pulled from Docker Hub and the chart no longer installed"
    - kind: removed
      description: "memcached is no longer supported as a built-in service: Seafile 13 uses Redis for caching"
    - kind: changed
      description: "BREAKING: MariaDB and Redis are now dedicated templates on official images; values moved to database.* and cache.*"
    - kind: changed
      description: "BREAKING: seafile.environment replaced with structured fields and seafile.extraEnv"
    - kind: changed
      description: "BREAKING: seafile.image replaced with image.repository and image.tag"
    - kind: changed
      description: "BREAKING: ingress.enabled now defaults to false — the Ingress used to be created always"
    - kind: fixed
      description: "Ingress with TLS no longer renders secretName: map[] and an empty host"
    - kind: fixed
      description: "The webdav Ingress is now only created when seafile.webdav.enabled is set, and points to an existing port"
    - kind: fixed
      description: "clusterDomain is now declared — the database address no longer ends with a trailing dot"
    - kind: fixed
      description: "The Traefik Middleware is now actually attached to the Ingress via the router.middlewares annotation"
    - kind: security
      description: "Passwords moved into a Secret and are wired in via secretKeyRef; they no longer appear in plain text in the pod spec"
  artifacthub.io/images: |
    - name: seafile
      image: docker.io/seafileltd/seafile-mc:13.0.25
    - name: mariadb
      image: docker.io/mariadb:11.4
    - name: redis
      image: docker.io/redis:8-alpine
  artifacthub.io/links: |
    - name: source
      url: https://github.com/gera-corp-org/helm-seafile
    - name: Seafile manual
      url: https://manual.seafile.com/13.0/
  artifacthub.io/maintainers: |
    - name: gera
      email: exandore@gmail.com
  artifacthub.io/license: MIT
