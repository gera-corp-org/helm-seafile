# Значения по умолчанию для чарта seafile.

# Домен кластера. Использовался в шаблонах, но не был объявлен,
# из-за чего FQDN рендерился с точкой на конце.
clusterDomain: cluster.local

nameOverride: ""
fullnameOverride: ""

# 0 останавливает Seafile, не удаляя релиз и данные.
replicaCount: 1

image:
  repository: docker.io/seafileltd/seafile-mc
  # Пусто — берётся appVersion чарта.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

seafile:
  # Обязателен: без него Seafile генерирует нерабочие ссылки.
  serverHostname: ""
  protocol: https
  timeZone: Etc/UTC
  logToStdout: false
  admin:
    email: ""
    password: ""
  # pwgen -s 40 1
  jwtPrivateKey: ""
  webdav:
    enabled: false
  # Секрет с ключами admin-email, admin-password, jwt-private-key.
  # Задан — чарт свой секрет не создаёт.
  existingSecret: ""
  # Сырой список env. Добавляется последним, поэтому переопределяет
  # всё вышестоящее. Сюда кладутся vault: ссылки для bank-vaults.
  extraEnv: []
  extraEnvFrom: []

database:
  # false — использовать внешнюю БД, тогда host обязателен.
  enabled: true
  host: ""
  port: 3306
  user: seafile
  password: ""
  rootPassword: ""
  # Секрет с ключами mariadb-root-password и mariadb-password.
  existingSecret: ""
  names:
    ccnet: ccnet_db
    seafile: seafile_db
    seahub: seahub_db
  image:
    repository: docker.io/mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    existingClaim: ""
  resources: {}

cache:
  # Пробрасывается в CACHE_PROVIDER. Встроен только redis; внешний
  # memcached задаётся provider: memcached вместе с host.
  provider: redis
  enabled: true
  host: ""
  port: 6379
  password: ""
  # Секрет с ключом redis-password.
  existingSecret: ""
  image:
    repository: docker.io/redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  resources: {}

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  existingClaim: ""
  annotations:
    helm.sh/resource-policy: keep

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""
  webdav:
    path: /seafdav
  traefik:
    # Создаёт Middleware и подключает её к Ingress. Нужна для
    # загрузки больших файлов через WebDAV.
    buffering: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Первичная инициализация БД занимает минуты, отсюда запас.
startupProbe:
  httpGet:
    path: /api2/ping/
    port: http
  periodSeconds: 10
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /api2/ping/
    port: http
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /api2/ping/
    port: http
  periodSeconds: 10
