# Default values for the seafile chart.

# Cluster domain. Used in templates but was never declared,
# which caused the FQDN to render with a trailing dot.
clusterDomain: cluster.local

nameOverride: ""
fullnameOverride: ""

# 0 stops Seafile without deleting the release or its data.
replicaCount: 1

image:
  repository: docker.io/seafileltd/seafile-mc
  # Empty — falls back to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

seafile:
  # Required: without it Seafile generates broken links.
  serverHostname: ""
  protocol: https
  timeZone: Etc/UTC
  logToStdout: false
  admin:
    email: ""
    password: ""
  # pwgen -s 40 1
  jwtPrivateKey: ""
  webdav:
    enabled: false
  # Secret with the admin-email, admin-password, jwt-private-key keys.
  # If set, the chart won't create its own Secret.
  existingSecret: ""
  # Raw env list. Appended last, so it overrides everything above.
  # This is where vault: references for bank-vaults go.
  extraEnv: []
  extraEnvFrom: []

database:
  # false — use an external database; host is then required.
  enabled: true
  host: ""
  port: 3306
  user: seafile
  password: ""
  rootPassword: ""
  # Secret with the mariadb-root-password and mariadb-password keys.
  existingSecret: ""
  names:
    ccnet: ccnet_db
    seafile: seafile_db
    seahub: seahub_db
  image:
    repository: docker.io/mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    existingClaim: ""
    # Subdirectory of the volume to use as the data directory. Leave empty
    # unless you are adopting a volume written by another chart: the Bitnami
    # MariaDB chart, for one, keeps its data under a "data" subdirectory,
    # and mounting the volume root at /var/lib/mysql makes the official
    # image treat it as empty and initialize a fresh database beside it.
    subPath: ""
  # The official MariaDB image starts as root and drops to the mysql user
  # itself, so runAsNonRoot needs an explicit runAsUser/runAsGroup of 999
  # plus fsGroup 999 on the pod, or the server cannot write its data
  # directory.
  podSecurityContext: {}
  securityContext: {}
  resources: {}

cache:
  # Passed through to CACHE_PROVIDER. Only redis is built in; external
  # memcached is configured with provider: memcached together with host.
  provider: redis
  enabled: true
  host: ""
  port: 6379
  password: ""
  # Secret with the redis-password key.
  existingSecret: ""
  image:
    repository: docker.io/redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  # Same shape as database.*: the official Redis image drops to the redis
  # user through its entrypoint, so running as non-root needs runAsUser 999.
  podSecurityContext: {}
  securityContext: {}
  resources: {}

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  existingClaim: ""
  annotations:
    helm.sh/resource-policy: keep

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""
  webdav:
    path: /seafdav
  traefik:
    # Creates a Middleware and attaches it to the Ingress. Needed for
    # uploading large files over WebDAV.
    buffering: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Initial database setup takes minutes, hence the generous threshold.
startupProbe:
  httpGet:
    path: /api2/ping/
    port: http
  periodSeconds: 10
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /api2/ping/
    port: http
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /api2/ping/
    port: http
  periodSeconds: 10
